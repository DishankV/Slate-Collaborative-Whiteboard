services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-whiteboard_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: whiteboard
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [whiteboard_net]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-whiteboard_admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/whiteboard?authSource=admin
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      BCRYPT_SALT_ROUNDS: 10
    ports:
      - '4000:4000'
    networks: [whiteboard_net]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - '8080:80'
    networks: [whiteboard_net]

volumes:
  mongo_data: # named volume = drawings and chat survive container restarts/rebuilds

networks:
  whiteboard_net:
    driver: bridge
